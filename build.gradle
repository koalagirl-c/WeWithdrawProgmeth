plugins {
    id 'java'
    id 'application'
    id 'org.openjfx.javafxplugin' version '0.1.0'
}

group = 'progmeth_2025_1'
version = '1'

repositories {
    mavenCentral()
}

dependencies {
    // JavaFX 24 Core Dependencies
    implementation 'org.openjfx:javafx-controls:24.0.1'
    implementation 'org.openjfx:javafx-fxml:24.0.1'
    implementation 'org.openjfx:javafx-web:24.0.1'
    implementation 'org.openjfx:javafx-graphics:24.0.1'
    implementation 'org.openjfx:javafx-media:24.0.1'
    implementation 'org.openjfx:javafx-swing:24.0.1'

    // TestFX dependencies (สำหรับทดสอบ GUI)
    testImplementation 'org.testfx:testfx-core:4.0.17'
    testImplementation 'org.testfx:testfx-junit5:4.0.17'
    testImplementation 'org.hamcrest:hamcrest:2.2'

    // JUnit 5 Platform & Engine
    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'

    // ตัวแก้บั๊กหลัก: ใส่เพื่อบังคับให้เครื่องยนต์ทดสอบของ Gradle สแกนหา JUnit Platform เจอตอน Runtime
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

javafx {
    version = '24.0.1'
    modules = ['javafx.controls', 'javafx.fxml', 'javafx.graphics', 'javafx.media', 'javafx.web', 'javafx.swing']
}

application {
    mainClass = 'com.gachapet.KawaiiPetApp'
}

run {
    standardInput = System.in
    // อนุญาตให้เข้าถึงหน่วยความจำสำหรับการรันบน JavaFX 24
    jvmArgs += [
            "--enable-native-access=javafx.graphics",
            "--sun-misc-unsafe-memory-access=allow"
    ]
}

test {
    useJUnitPlatform()

    // แสดงผลการเทสบน Console ให้เห็นชัดๆ ว่าผ่าน/ไม่ผ่าน
    testLogging {
        events "passed", "skipped", "failed"
        exceptionFormat "full"
    }

    // TestFX configuration for JavaFX 24
    systemProperty 'testfx.robot', 'glass'
    systemProperty 'testfx.setup.timeout', '60000'
    systemProperty 'testfx.launch.timeout', '60000'

    // ปลดล็อกความปลอดภัยของโมดูลทั้งหมดที่ JUnit และ TestFX ต้องใช้ในการเจาะเข้าทดสอบระบบ
    jvmArgs += [
            '--add-opens', 'javafx.graphics/com.sun.javafx.application=ALL-UNNAMED',
            '--add-opens', 'javafx.graphics/com.sun.glass.ui=ALL-UNNAMED',
            '--add-exports', 'javafx.graphics/com.sun.glass.ui=ALL-UNNAMED',
            '--add-exports', 'javafx.base/com.sun.javafx.runtime=ALL-UNNAMED',
            '--enable-native-access=javafx.graphics',
            '--sun-misc-unsafe-memory-access=allow'
    ]
}

// ตั้งค่าสำหรับการกดดึงตัวโปรเจกต์ออกไปเป็นไฟล์ .jar เพื่อไปส่งงาน
jar {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    // มัดรวมคอมไพล์โค้ดและซอร์สโค้ดไว้ให้ตามข้อกำหนดอาจารย์
    from sourceSets.main.output
    from sourceSets.main.allSource

    manifest {
        attributes(
                'Main-Class': application.mainClass.get()
        )
    }

    archiveFileName = "${project.name}-${project.version}-with-sources.jar"
}